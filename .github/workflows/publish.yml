name: Build and publish image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  schedule:
    # Weekly rebuild to pick up base image and package security updates
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PG_MAJOR: "18"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            # Releases (v1.2.3): latest, pg18, pg18-1.2.3, pg18-1.2, pg18-1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=pg${{ env.PG_MAJOR }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},prefix=pg${{ env.PG_MAJOR }}-
            type=semver,pattern={{major}}.{{minor}},prefix=pg${{ env.PG_MAJOR }}-
            type=semver,pattern={{major}},prefix=pg${{ env.PG_MAJOR }}-,enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # master: edge, pg18-edge
            type=edge,branch=master
            type=edge,branch=master,prefix=pg${{ env.PG_MAJOR }}-
            # Every build: immutable pg18-sha-abc1234
            type=sha,prefix=pg${{ env.PG_MAJOR }}-sha-
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: PG_MAJOR=${{ env.PG_MAJOR }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scheduled builds skip the cache so apt-get re-runs and pulls fresh packages
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
